[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "chicago-crimes-analytics"
version = "0.2.0"
description = "Distributed PySpark, Delta Lake, Kafka streaming, and ML analytics platform for Chicago Crime records."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "boto3==1.35.90",
    "requests==2.32.3",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "matplotlib==3.9.2",
    "prince==0.13.0",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
    "confluent-kafka==2.6.1",
    "great-expectations>=1.25.0",
    "mlflow>=3.18.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]
cloud = [
    "dbt-bigquery>=1.12.3",
    "dbt-core>=1.12.7",
    "google-cloud-bigquery>=3.47.0",
]

[project.scripts]
chicago-crimes = "chicago_crimes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chicago_crimes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
markers = [
    "integration: tests requiring live Docker Compose services (Spark Standalone, MinIO, Kafka, Airflow)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]
